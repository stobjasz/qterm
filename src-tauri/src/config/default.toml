# qterm settings. Changes apply as soon as you save this file.
# If a value is invalid, qterm keeps the previous settings and shows the error.

# The key that shows and hides the console: one key, no modifiers.
# "Backquote" (or "~") is the key left of 1. Other good choices: "ScrollLock",
# "Pause", "F13" - "F24". (F12 can't be used: Windows reserves it.) The tray
# menu can switch the hotkey off when you need to type that key in another app.
hotkey = "Backquote"

# Console size as a share of the monitor's work area. Width is centered.
height = 0.5   # 0.1 - 1.0
width = 1.0    # 0.2 - 1.0

# Which monitor the console drops onto: "cursor" (where the mouse is) or "primary".
monitor = "cursor"

# Background opacity, 0.0 (clear) - 1.0 (solid).
opacity = 0.82

# What shows through the translucent background: "none" (the windows behind, sharp),
# "acrylic" (them, blurred and tinted, like frosted glass) or "mica" (the
# wallpaper's tint). Windows 11. Lower opacity lets more of the effect through.
background_effect = "none"

# Slide animation in milliseconds, 0 - 1000 (0 = no animation).
slide_ms = 150

# Hide the console when you click into another window.
hide_on_blur = false

# Profile for new tabs: "pwsh", "powershell", "cmd", "git-bash" or "wsl:<distro>".
# Empty means the first one found (PowerShell 7 if installed).
default_profile = ""

# Colour theme: "qterm", "campbell", "one-dark", "dracula", "nord", "gruvbox-dark",
# "tokyo-night", "solarized-dark" or "solarized-light".
theme = "qterm"

# Copy selected text as soon as you select it.
copy_on_select = false
# Right-click copies the selection, or pastes when nothing is selected.
right_click_paste = true

# Reopen your tabs and split layout (with their profiles and folders) on start.
restore_session = true

# Let shells report their current folder, so restored and split panes open where
# you were. PowerShell and cmd prompts (and Git Bash) get an invisible marker;
# your own prompt is kept. Applies to newly opened tabs and panes.
shell_integration = true

# Remember Claude Code sessions: when a terminal prints "claude --resume <id>",
# qterm keeps it with its folder so you can resume it later from the tab bar.
claude_sessions = false

# Alert you (Windows notification, tab marker) when Claude Code in a qterm tab is
# waiting for you. Needs qterm's Notification hook in Claude Code's settings:
# Settings → "Set up Claude Code alerts" adds it.
claude_alerts = true

# When tabs are reopened on start (restore_session), also resume the Claude Code
# session that was running in each pane: `claude --resume <id>` is typed for you.
# Works best with the Claude Code hook set up (Settings), which says exactly which
# session runs where.
claude_restore = false

# Ctrl+click a file reference like src/app.ts:42 to open it with this command.
# {file}, {line} and {col} are filled in; double quotes keep a program path with
# spaces together, e.g.
#   editor = '"C:\Program Files\Notepad++\notepad++.exe" -n{line} -c{col} {file}'
# Without the editor installed, the file opens in its default app.
editor = "code --goto {file}:{line}:{col}"

# When a command that ran at least this many seconds finishes and you aren't
# looking at its pane: a ✓ or ✗ on the tab and a Windows notification. 0 = off.
# Needs shell_integration (PowerShell, cmd, Git Bash).
long_command_alert = 30

# Show images that programs print as sixel, iTerm or Kitty graphics (e.g. chafa,
# img2sixel, timg).
inline_images = true

# Offer each Host in ~/.ssh/config as a shell ("SSH <host>" in the ▾ menu and the
# palette). Patterns like *.internal are left out; Include files aren't read.
ssh_profiles = true

# Look for a newer qterm (GitHub Releases) shortly after start and then daily. When
# there is one, the tray and Settings → Updates offer it; nothing installs by itself.
check_updates = true

# "Open in qterm" in Explorer's menu for folders, folder backgrounds and drives: a
# new tab in that folder. On Windows 11 it is under "Show more options".
explorer_menu = false

# Ask before pasting several lines into a shell (Ctrl+Shift+V, right-click): each
# line would run as a command. Not asked in Claude Code or full-screen programs,
# where several lines are normal input.
paste_warning = true

# Keep each pane's output across restarts (with restore_session): restored panes
# show their earlier output above a "restored" line. `lines` per pane, 100 - 10000.
# `profiles` switches it per shell, overriding `restore`, e.g.
#   profiles = { "wsl:Ubuntu" = false, cmd = true }
[scrollback]
restore = true
lines = 1000
profiles = {}

[font]
family = '"Cascadia Mono", "Cascadia Code", Consolas, monospace'
size = 14   # 6 - 72
# Programming ligatures (=> != ->). Needs a font that has them, e.g. "Cascadia
# Code" or "Fira Code"; Cascadia Mono has none.
ligatures = false

# Override shortcuts as  action = "ctrl+shift+t"  ("" unbinds it). A chord needs
# ctrl or alt unless its key is an F-key. Modifiers: ctrl, alt, shift. Keys: a-z,
# 0-9, f1-f24, tab, left, right, up, down, pageup, pagedown, home, end, insert,
# delete, space, enter, and ` - = , . / \ [ ] ; '
# Every action and its default:
#   new_tab          = "ctrl+shift+t"
#   close_pane       = "ctrl+shift+w"
#   next_tab         = "ctrl+tab"
#   prev_tab         = "ctrl+shift+tab"
#   split_right      = "alt+shift+="
#   split_down       = "alt+shift+-"
#   equalize         = "alt+shift+0"
#   focus_left       = "alt+left"
#   focus_right      = "alt+right"
#   focus_up         = "alt+up"
#   focus_down       = "alt+down"
#   resize_left      = "alt+shift+left"
#   resize_right     = "alt+shift+right"
#   resize_up        = "alt+shift+up"
#   resize_down      = "alt+shift+down"
#   copy             = "ctrl+shift+c"
#   paste            = "ctrl+shift+v"
#   find             = "ctrl+shift+f"
#   settings         = "ctrl+,"
#   command_palette  = "ctrl+shift+p"
#   zoom_pane        = "alt+shift+z"
#   toggle_broadcast = "alt+shift+b"
#   swap_left        = ""   (none)
#   swap_right       = ""   (none)
#   swap_up          = ""   (none)
#   swap_down        = ""   (none)
#   clear_history    = ""   (none)
#   prev_command     = "ctrl+up"
#   next_command     = "ctrl+down"
#   copy_last_output = ""   (none)
#   search_all       = "alt+shift+f"
#   pane_background  = ""   (none)
#   next_waiting     = "alt+shift+w"
#   save_output      = ""   (none)
#   open_output      = ""   (none)
#   quick_select     = "alt+shift+s"
#   toggle_pin       = ""   (none)
#   show_help        = "ctrl+shift+/"
#   stop_programs    = ""   (none)
#   view_json        = ""   (none)
#   toggle_size      = "f11"
#   split_right_with = "ctrl+alt+shift+="
#   split_down_with  = "ctrl+alt+shift+-"
#   switch_shell     = ""   (none)
# Ctrl+Alt+1..9 (go to tab) and Ctrl+Shift+1..9 (new tab with profile N) are fixed.
[keybindings]

# Your own shells, next to the detected ones (▾ menu, palette). Double quotes keep
# spaces together in `command`. `theme` and `font_size` give its panes their own
# look, `tab_color` and `icon` mark its tabs. An `id` of a detected profile ("pwsh",
# "cmd", "ssh:<host>", ...) restyles that one.
#
# [[profiles]]
# name = "API server"
# command = 'pwsh -NoExit -Command "npm run dev"'
# cwd = "C:/work/api"
# env = { NODE_ENV = "development" }
# theme = "dracula"
# font_size = 13
# tab_color = "green"    # red, orange, yellow, green, teal, blue, purple, pink
# icon = "🚀"            # shown before the tab's title
# background = "#1e1e2e" # its panes' background (a `theme` brings its own)
#
# [[profiles]]
# name = "Build box"
# command = "ssh me@build-box"

# Named layouts open as a new tab (▾ menu → Layouts, or the palette). A pane with
# `panes` is a split: "row" side by side, "column" stacked. `profile` is an id or a
# name; `command` is typed into the shell once it starts. "Save this tab as a
# layout" in the ▾ menu writes one of these for you.
#
# Triggers: when a line a shell prints matches `pattern` (text, ignoring case; or a
# JavaScript regular expression with `regex = true`), qterm can:
#   action = "highlight"  colour the line (`color = "#rrggbb"`, a dark amber by default)
#   action = "mark"       put ⚑ on the tab (until you look at it)
#   action = "notify"     mark the tab and, when you aren't looking, notify (the default)
# Full-screen programs and output restored after a restart don't count.
#
# [[triggers]]
# name = "Build done"
# pattern = "Compiled successfully"
#
# [[triggers]]
# pattern = 'error TS\d+'   # single quotes: the backslash stays as it is
# regex = true
# action = "highlight"

# Snippets: named commands typed into the current pane from the palette
# (Ctrl+Shift+P, then the name). `run = true` presses Enter too; without it the
# command waits at the prompt for you to edit.
#
# [[snippets]]
# name = "Git log graph"
# command = "git log --oneline --graph -20"
# run = true

# [[layouts]]
# name = "dev"
# split = "row"
# panes = [
#   { profile = "API server" },
#   { cwd = "C:/work/web", command = "npm start" },
#   { split = "column", panes = [ {}, { profile = "wsl:Ubuntu" } ] },
# ]
